<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muskan Admin (Debug Mode)</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #e5ddd5; display: flex; justify-content: center; padding: 20px; }
    .app { background: white; width: 100%; max-width: 400px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
    .header { background: #008069; color: white; padding: 15px; text-align: center; font-weight: bold; }
    .content { padding: 20px; }
    input, textarea, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    label { display: block; margin-top: 15px; font-size: 13px; font-weight: bold; color: #54656f; }
    button { width: 100%; padding: 12px; background: #008069; color: white; border: none; font-weight: bold; border-radius: 24px; margin-top: 20px; cursor: pointer; }
    
    .status { text-align: center; margin-top: 10px; font-size: 14px; min-height: 20px; word-wrap: break-word; }
    .error { color: red; } .success { color: green; }
    
    .debug-box { background: #333; color: #0f0; font-family: monospace; font-size: 10px; padding: 10px; margin-top: 20px; border-radius: 5px; display: none; }
  </style>
</head>
<body>

  <div class="app">
    <div class="header">📢 Muskan Debugger</div>
    <div class="content">
      
      <label>Admin Password</label>
      <input type="password" id="password" value="muskan123">

      <button onclick="testNow()" style="background:#007bff; margin-top:10px;">🧪 Test Connection (Send Immediate)</button>

      <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

      <label>Message</label>
      <textarea id="msg" rows="3" placeholder="Type update..."></textarea>

      <label>Image URL (Optional)</label>
      <input type="text" id="img" placeholder="https://...">

      <label>Frequency</label>
      <select id="freq">
        <option value="once">Send Once (Now)</option>
        <option value="1hr">Every 1 Hour</option>
      </select>

      <button onclick="schedule()">🚀 Schedule Notification</button>
      
      <div id="status" class="status"></div>
      <div id="debug" class="debug-box"></div>

      <div id="list" style="margin-top:20px; font-size:12px;"></div>

      <button onclick="clearAll()" style="background:#ea0038; margin-top:20px;">🛑 Stop All</button>
    </div>
  </div>

  <script>
    // ⚠️ REPLACE THIS WITH YOUR SUPABASE URL ⚠️
    const API_URL = "https://upvprcemxefhviwptqnb.supabase.co/functions/v1/onesignal-notification-UI";

    async function apiCall(body) {
      const pass = document.getElementById('password').value;
      const status = document.getElementById('status');
      const debug = document.getElementById('debug');
      
      status.innerText = "Processing...";
      debug.style.display = 'none';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...body, password: pass })
        });
        
        const data = await res.json();
        
        // Show raw response for debugging
        debug.innerText = JSON.stringify(data, null, 2);
        debug.style.display = 'block';

        if (!res.ok) throw new Error(data.error || "Request failed");
        
        status.innerText = "✅ Success!";
        status.className = "status success";
        if(body.action !== "test_immediate") loadList(); 
        return data;

      } catch (err) {
        status.innerText = "❌ " + err.message;
        status.className = "status error";
        console.error(err);
      }
    }

    function testNow() {
      apiCall({ action: "test_immediate" });
    }

    function schedule() {
      apiCall({
        action: "schedule",
        msg: document.getElementById('msg').value,
        img: document.getElementById('img').value,
        freq: document.getElementById('freq').value
      });
    }

    function clearAll() {
      if(confirm("Stop all messages?")) apiCall({ action: "clear" });
    }

    async function loadList() {
      const pass = document.getElementById('password').value;
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: "list", password: pass })
        });
        const tasks = await res.json();
        document.getElementById('list').innerHTML = tasks.length ? "Active: " + tasks.length : "No active tasks";
      } catch (e) { console.log(e); }
    }
    loadList();
  </script>
</body>
</html>
