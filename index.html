<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Muskan Traders VIP</title>
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      
      // CONFIGURATION
      const MY_WHATSAPP_NUMBER = "919328060689"; 
      const MSG_NEW = "Subscribe"; 
      const MSG_EXISTING = "Send todays update";

      // Get Phone from URL
      const urlParams = new URLSearchParams(window.location.search);
      const userPhone = urlParams.get('phone');

      // Helper: Trigger Redirect
      function triggerWhatsAppRedirect(type) {
          const msg = type === 'new' ? MSG_NEW : MSG_EXISTING;
          const url = `https://wa.me/${MY_WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
          
          // Update UI
          document.getElementById("loader").style.display = "flex";
          document.getElementById("main-content").style.display = "none";
          document.getElementById("loading-text").innerText = "Redirecting to WhatsApp...";
          
          // Redirect after 1 second
          setTimeout(() => {
              window.location.href = url;
          }, 1000);
      }

      OneSignalDeferred.push(function(OneSignal) {
        OneSignal.init({
          appId: "111d15bc-6774-4842-8555-50208b06fdfd",
          notifyButton: { enable: false },
          path: "/MuskanTraders/",
          serviceWorkerPath: "OneSignalSDKWorker.js",
          serviceWorkerParam: { scope: "/MuskanTraders/" },
          allowLocalhostAsSecureOrigin: true,
        });

        // --- LOGIC: Check Status on Load ---
        setTimeout(() => {
            // Check if user is ALREADY subscribed
            const isSubscribed = OneSignal.User.PushSubscription.optedIn;
            
            if (isSubscribed) {
                console.log("✅ User already subscribed. Redirecting...");
                triggerWhatsAppRedirect('existing');
            } else {
                console.log("❌ User NOT subscribed. Showing button.");
                document.getElementById("loader").style.display = "none";
                document.getElementById("main-content").style.display = "flex";
            }
        }, 1500); // Wait 1.5s to ensure OneSignal loads data

        // --- LOGIC: Handle New Subscription Click ---
        OneSignal.User.PushSubscription.addEventListener("change", function(event) {
          if (event.current.optedIn) {
            console.log("🎉 User just clicked Allow!");
            
            // Tag them
            if(userPhone) OneSignal.User.addTag("phone_number", userPhone);
            
            // Redirect
            triggerWhatsAppRedirect('new');
          }
        });
      });

      // Button Click
      function requestPermission() {
          window.OneSignalDeferred.push(function(OneSignal) {
              OneSignal.Slidedown.promptPush();
          });
      }
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111b21; /* WhatsApp Dark Mode BG */
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        /* CARD STYLE */
        .container {
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* PROFILE IMAGE */
        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: #00a884;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        h2 { margin: 0 0 10px; font-weight: 600; font-size: 22px; }
        p { color: #8696a0; font-size: 15px; margin-bottom: 30px; line-height: 1.5; }

        /* GREEN BUTTON */
        .btn {
            background-color: #00a884;
            color: #111b21;
            border: none;
            padding: 16px 20px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); background-color: #008f6f; }

        /* LOADER SCREEN */
        #loader {
            display: flex; /* Visible by default */
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #00a884;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* MAIN CONTENT (Hidden initially) */
        #main-content {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* SKIP LINK */
        .skip-link {
            margin-top: 25px;
            color: #53bdeb;
            font-size: 13px;
            text-decoration: none;
            border-bottom: 1px dashed #53bdeb;
            padding-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="loader">
            <div class="spinner"></div>
            <p id="loading-text">Checking subscription status...</p>
        </div>

        <div id="main-content">
            <div class="profile-img">🛍️</div>
            <h2>Muskan Traders VIP</h2>
            <p>
                1. Tap the button below.<br>
                2. Click <strong>Allow</strong> on the popup.<br>
                3. Get Daily Wholesale Deals.
            </p>
            
            <button class="btn" onclick="requestPermission()">
                <span>👉</span> <span>Join on WhatsApp</span>
            </button>
        </div>

        <a href="https://wa.me/919328060689?text=Subscribe" class="skip-link">
            Not working? Click here to open WhatsApp
        </a>
    </div>

</body>
</html>
