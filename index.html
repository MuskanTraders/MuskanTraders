<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Muskan Traders VIP</title>
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      
      // --- CONFIGURATION ---
      const MY_WHATSAPP_NUMBER = "919328060689"; 
      
      // Messages
      const MSG_NEW = "Subscribe"; 
      const MSG_EXISTING = "Send todays update";

      // Get Phone from URL
      const urlParams = new URLSearchParams(window.location.search);
      const userPhone = urlParams.get('phone');

      // --- MAIN REDIRECT FUNCTION ---
      function performRedirect(type) {
          const msg = type === 'new' ? MSG_NEW : MSG_EXISTING;
          
          // Using api.whatsapp.com is more reliable for deep linking
          const url = `https://api.whatsapp.com/send?phone=${MY_WHATSAPP_NUMBER}&text=${encodeURIComponent(msg)}`;
          
          // Update UI Text
          document.getElementById("loader").style.display = "flex";
          document.getElementById("main-content").style.display = "none";
          document.getElementById("loading-text").innerText = "Opening WhatsApp...";
          
          // Update the "Safety Button" immediately
          const manualLink = document.getElementById("manual-link");
          manualLink.href = url;
          manualLink.style.display = "block";

          // Attempt Auto-Redirect
          setTimeout(() => {
              window.location.href = url;
          }, 1000);
      }

      OneSignalDeferred.push(function(OneSignal) {
        OneSignal.init({
          appId: "111d15bc-6774-4842-8555-50208b06fdfd",
          notifyButton: { enable: false },
          path: "/MuskanTraders/",
          serviceWorkerPath: "OneSignalSDKWorker.js",
          serviceWorkerParam: { scope: "/MuskanTraders/" },
          allowLocalhostAsSecureOrigin: true,
        });

        // --- CHECK STATUS LOOP (Runs every 1s) ---
        let attempts = 0;
        const checkInterval = setInterval(() => {
            attempts++;
            
            // Check if OneSignal is fully loaded
            if (OneSignal.User && OneSignal.User.PushSubscription) {
                const isSubscribed = OneSignal.User.PushSubscription.optedIn;

                if (isSubscribed) {
                    // STOP Checking
                    clearInterval(checkInterval);
                    console.log("✅ User is ALREADY Subscribed.");

                    // *** CRITICAL FIX: UPDATE TAG EVEN IF SUBSCRIBED ***
                    if (userPhone) {
                        console.log("🔄 Updating Phone Tag to: " + userPhone);
                        OneSignal.User.addTag("phone_number", userPhone);
                    }

                    // Redirect
                    performRedirect('existing');
                } 
                else if (attempts >= 3) {
                    // STOP Checking -> User is NOT subscribed
                    clearInterval(checkInterval);
                    console.log("❌ New User detected.");
                    
                    // Show the Join Button
                    document.getElementById("loader").style.display = "none";
                    document.getElementById("main-content").style.display = "flex";
                }
            }
        }, 1000);

        // --- EVENT: User Clicks Allow ---
        OneSignal.User.PushSubscription.addEventListener("change", function(event) {
          if (event.current.optedIn) {
            console.log("🎉 Permission Granted!");
            if(userPhone) OneSignal.User.addTag("phone_number", userPhone);
            performRedirect('new');
          }
        });
      });

      // --- BUTTON CLICK ---
      function requestPermission() {
          window.OneSignalDeferred.push(function(OneSignal) {
              OneSignal.Slidedown.promptPush();
          });
      }
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #111b21;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container { width: 90%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
        
        .profile-img {
            width: 90px; height: 90px; border-radius: 50%; background-color: #00a884;
            display: flex; align-items: center; justify-content: center; font-size: 35px;
            margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        h2 { margin: 0 0 10px; font-weight: 600; font-size: 22px; }
        p { color: #8696a0; font-size: 15px; margin-bottom: 30px; line-height: 1.5; }

        .btn {
            background-color: #00a884; color: #111b21; border: none; padding: 16px 20px;
            font-size: 16px; border-radius: 25px; cursor: pointer; width: 100%; font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn:active { background-color: #008f6f; }

        /* Loader */
        #loader { display: flex; flex-direction: column; align-items: center; }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1); border-left-color: #00a884;
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Main Content */
        #main-content { display: none; flex-direction: column; align-items: center; width: 100%; }

        /* Safety Button */
        #manual-link {
            display: none; /* Hidden until redirect starts */
            margin-top: 20px;
            background: transparent;
            border: 1px solid #53bdeb;
            color: #53bdeb;
            padding: 10px 25px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="loader">
            <div class="spinner"></div>
            <p id="loading-text">Loading...</p>
            <a id="manual-link" href="#">Tap here to Open WhatsApp</a>
        </div>

        <div id="main-content">
            <div class="profile-img">🛍️</div>
            <h2>Muskan Traders VIP</h2>
            <p>
                1. Tap the button below.<br>
                2. Click <strong>Allow</strong> on the popup.<br>
                3. Get Daily Wholesale Deals.
            </p>
            
            <button class="btn" onclick="requestPermission()">
                <span>👉</span> <span>Join on WhatsApp</span>
            </button>
        </div>
    </div>

</body>
</html>
