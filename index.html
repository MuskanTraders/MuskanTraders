<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Join VIP List</title>
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      
      // 1. Get Phone from URL
      const urlParams = new URLSearchParams(window.location.search);
      const userPhone = urlParams.get('phone');
      
      // Your Business Number
      const MY_WHATSAPP_NUMBER = "919328060689"; 

      OneSignalDeferred.push(function(OneSignal) {
        OneSignal.init({
          appId: "111d15bc-6774-4842-8555-50208b06fdfd", // Your App ID
          notifyButton: { enable: false }, // Hide the default bell
          
          // --- PATH CONFIGURATION ---
          serviceWorkerPath: "/MuskanTraders/OneSignalSDKWorker.js",
          serviceWorkerParam: { scope: "/MuskanTraders/" },
          path: "/MuskanTraders/",
          allowLocalhostAsSecureOrigin: true,
        });

        // 2. THE REDIRECT LOGIC
        OneSignal.User.PushSubscription.addEventListener("change", function(event) {
          if (event.current.optedIn) {
            // A. Tag the user
            if(userPhone) OneSignal.User.addTag("phone_number", userPhone);
            
            // B. Visual Feedback
            document.getElementById("btn-text").innerText = "Redirecting...";
            
            // C. Redirect to WhatsApp (Wait 1s for tag to save)
            setTimeout(function() {
                window.location.href = `https://wa.me/${MY_WHATSAPP_NUMBER}?text=Subscribe`;
            }, 1000);
          }
        });
      });

      // 3. Button Click Function
      function startFlow() {
          // Trigger the Native Browser Prompt
          window.OneSignalDeferred.push(function(OneSignal) {
              OneSignal.Slidedown.promptPush();
          });
      }
    </script>

    <style>
        /* Mobile-First CSS */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111b21; /* WhatsApp Dark Background */
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            width: 90%;
            max-width: 400px;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #00a884;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h2 { margin: 0 0 10px; font-weight: 600; }
        p { color: #8696a0; font-size: 15px; margin-bottom: 30px; line-height: 1.5; }
        
        /* The Big Green Button */
        .btn {
            background-color: #00a884;
            color: #111b21;
            border: none;
            padding: 18px 20px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); background-color: #008f6f; }
        
        /* Fallback Link */
        .skip-link {
            margin-top: 20px;
            color: #53bdeb;
            font-size: 14px;
            text-decoration: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-img">🛍️</div>

        <h2>Muskan Traders VIP</h2>
        <p>
            1. Tap the button below.<br>
            2. Click <strong>Allow</strong> on the popup.<br>
            3. We will open WhatsApp for you.
        </p>
        
        <button class="btn" onclick="startFlow()">
            <span>👉</span> <span id="btn-text">Join on WhatsApp</span>
        </button>

        <a href="https://wa.me/919876543210?text=Subscribe" class="skip-link">
            Not working? Click to open WhatsApp directly
        </a>
    </div>

</body>
</html>
