<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muskan Traders</title>
    <link rel="manifest" href="/manifest.json">
    
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      
      // 1. Get Phone Number from URL Link (e.g. ?phone=919999999999)
      const urlParams = new URLSearchParams(window.location.search);
      const userPhone = urlParams.get('phone');

      OneSignalDeferred.push(function(OneSignal) {
        OneSignal.init({
          appId: "111d15bc-6774-4842-8555-50208b06fdfd",
          safari_web_id: "web.onesignal.auto.0d8cfe1b-addf-4fe0-8094-42e4bf6360cd",
          notifyButton: { enable: true },
          serviceWorkerPath: "OneSignalSDKWorker.js",
          serviceWorkerParam: { scope: "/MuskanTraders/" },
          allowLocalhostAsSecureOrigin: true
        });

        // 2. The Logic: If they subscribe, TAG them immediately
        OneSignal.User.PushSubscription.addEventListener("change", function(event) {
          if (event.current.optedIn && userPhone) {
            // This links their device to the phone number
            OneSignal.User.addTag("phone_number", userPhone);
            console.log("✅ User Tagged: " + userPhone);
            
            // Optional: Show a "Success" message on screen
            document.getElementById("status").innerText = "Success! You are subscribed.";
          }
        });

        // 3. Force the popup to show
        OneSignal.Slidedown.promptPush();
      });
    </script>

    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        .btn { background: #25D366; color: white; padding: 15px 30px; border-radius: 10px; text-decoration: none; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Tap "Allow" to get Daily Deals</h1>
    <p>We send one secret deal every morning.</p>
    <br>
    <h3 id="status" style="color:green;"></h3>
</body>
</html>
